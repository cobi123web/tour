services:
  - type: web
    name: wanderwell-travel
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn Trip.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
